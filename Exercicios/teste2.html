<!doctype html>
<html>
  <head>
    <title>&nbspTítulo da página</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  </head>
  <body>
    <h1>Título H! - Elementos: Table, IMG, Input (text e password)</h1>
    <br />
    <table border="1">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Cidade</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Juca Bala</td>
          <td>juca@bala.com.br</td>
          <td>Lajeado</td>
        </tr>
        <tr>
          <td>Maria Nervosa</td>
          <td>maria@nervosa.com.br</td>
          <td>Porto Alegre</td>
        </tr>
      </tbody>
    </table>
    <hr />
    <!-- linha separadora -->

    <h4>Utilizando uma imagem</h4>
    <img
      src="https://www.univates.br/media/institucional/em_imagens/2.jpg"
      width="1200"
      height="600"
      alt="Biblioteca Univates"
    />
    <br /><br />
    <section>
      <label for="nome">Nome:</label>
      <input type="text" name="nome" id="nome" />

      <br />

      <label for="senha">Senha:</label
      ><input type="password" name="senha" id="senha" />

      <br />
      <input type="button" name="autenticar" value="Autenticar" />
    </section>
  </body>
</html>
